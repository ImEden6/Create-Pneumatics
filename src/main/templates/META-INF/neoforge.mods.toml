modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"


[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"


credits="The Create team, for Create and Ponder"

authors="Mervyn"

description='''
A Create addon that runs on air. A Roots Blower turns rotation into pressure, brass tubes carry it, and the rest of the mod uses it: bell jars that process under vacuum, suction pads that lift blocks on contraptions, and tubes that shoot items between terminals.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,6.1)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="CLIENT"
